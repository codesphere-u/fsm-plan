[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "fsm-plan"
version = "0.1.0"
description = "Zero-dependency Eawag-Sandec Fecal Sludge Management (FSM) engineering kit: pit-latrine fill-rate & emptying intervals, vacuum-truck/gulper fleet sizing, drying-bed area, and WHO helminth pathogen inactivation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "fecal-sludge-management",
    "sanitation",
    "wash",
    "drying-beds",
    "public-health",
    "urban-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
fsm-plan = "fsm_plan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fsm_plan"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
